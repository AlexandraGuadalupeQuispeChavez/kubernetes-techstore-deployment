apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: techstore-app
  labels:
    app: techstore
data:
  STORE_NAME: "TechStore"
  CURRENCY: "USD"
  ENVIRONMENT: "production"
  index.html: |
    <!DOCTYPE html>
    <html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>TechStore - Catálogo Oficial</title>
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            body {
                font-family: 'Poppins', sans-serif;
                background: linear-gradient(135deg, #a18cd1 0%, #fbc2eb 100%);
                min-height: 100vh;
                display: flex;
                justify-content: center;
                align-items: center;
                padding: 20px;
            }
            .container {
                background: rgba(255, 255, 255, 0.95);
                padding: 60px 50px;
                border-radius: 25px;
                box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
                text-align: center;
                max-width: 700px;
                backdrop-filter: blur(10px);
            }
            h1 {
                color: #6b46c1;
                margin-bottom: 15px;
                font-size: 2.8em;
                font-weight: 700;
                letter-spacing: -1px;
            }
            .subtitle {
                color: #9f7aea;
                font-size: 1.1em;
                font-weight: 300;
                margin-bottom: 10px;
            }
            .version {
                display: inline-block;
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                color: white;
                padding: 10px 25px;
                border-radius: 50px;
                margin: 20px 0 30px 0;
                font-size: 1em;
                font-weight: 600;
            }
            .welcome {
                color: #4a5568;
                font-size: 1.15em;
                line-height: 1.8;
                margin-bottom: 35px;
                font-weight: 300;
            }
            .features {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
                gap: 20px;
                margin-top: 30px;
            }
            .feature {
                background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
                padding: 20px;
                border-radius: 15px;
                font-weight: 600;
                color: #6b46c1;
            }
            .footer {
                margin-top: 40px;
                color: #9f7aea;
                font-size: 0.9em;
                font-weight: 300;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <h1>TechStore</h1>
            <p class="subtitle">Catálogo Oficial</p>
            <div class="version">v1.0.0</div>
            <p class="welcome">
                Bienvenido a TechStore, tu tienda virtual de comercio electrónico.
                Nuestra plataforma está construida con tecnología de vanguardia
                utilizando Kubernetes para garantizar alta disponibilidad,
                escalabilidad y resiliencia en cada transacción.
            </p>
            <div class="features">
                <div class="feature">Alta Disponibilidad</div>
                <div class="feature">Zero Downtime</div>
                <div class="feature">Persistencia de Datos</div>
            </div>
            <p class="footer">Desplegado con Kubernetes | Orquestación de Contenedores</p>
        </div>
    </body>
    </html>
